<div class="login-page">

  <div class="login-card">

    <div class="logo">
      AI
    </div>

    <h1>
      Welcome Back
    </h1>

    <p>
      Login to your AI Interview account
    </p>


    <form
      (ngSubmit)="login()"
    >

      <div class="form-group">

        <label>
          Email
        </label>

        <input
          type="email"
          name="email"
          [(ngModel)]="email"
          placeholder="Enter your email"
        >

      </div>


      <div class="form-group">

        <label>
          Password
        </label>

        <input
          type="password"
          name="password"
          [(ngModel)]="password"
          placeholder="Enter your password"
        >

      </div>


      <p
        class="error"
        *ngIf="errorMessage"
      >
        {{ errorMessage }}
      </p>


      <button
        type="submit"
        [disabled]="loading"
      >

        {{
          loading
            ? 'Logging in...'
            : 'Login'
        }}

      </button>

    </form>


    <div class="register-link">

      Don't have an account?

      <a routerLink="/register">
        Create Account
      </a>

    </div>

  </div>

</div>
